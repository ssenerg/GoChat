name: Mobile

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "api/protobuf/proto/**"
      - ".github/workflows/mobile.yml"
  # Every pull request, so main can require android and ios: they skip,
  # which counts as passing, when the change touches nothing they build.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: mobile

# The runners carry a JDK, the Android SDK and Xcode.
jobs:
  # Whether a pull request touches the apps, the protos or this workflow.
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      # The pull request's merge commit and its first parent, the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
            git diff --name-only HEAD^ HEAD | grep -qE '^(mobile/|api/protobuf/proto/|\.github/workflows/mobile\.yml$)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The wrapper jar runs on every build: it must be one Gradle published.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Core tests
        run: ./gradlew --no-daemon :core:jvmTest
      # The release build runs R8 with the app's keep rules; without the
      # signing secrets it comes out unsigned.
      - name: Android app
        run: ./gradlew --no-daemon :androidApp:assembleDebug :androidApp:assembleRelease :androidApp:lint
      # The debug build, for trying a change on a phone; it installs as
      # io.github.ssenerg.gochat.debug, beside a release build.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GoChat-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Core on iOS
        run: ./gradlew --no-daemon :core:iosSimulatorArm64Test
      - name: iOS app
        # The Xcode project builds the Kotlin framework itself.
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO build
