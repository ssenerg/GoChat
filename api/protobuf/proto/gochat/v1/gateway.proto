syntax = "proto3";

package gochat.v1;

import "gochat/v1/types.proto";
import "google/protobuf/timestamp.proto";

// GatewayService carries the real-time events of the people a web gateway
// serves. A gateway attaches each of its connections with the session that
// opened it, and receives the events of those sessions' users only.
service GatewayService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

message ConnectRequest {
  oneof frame {
    Hello hello = 1;
    Attach attach = 2;
    Detach detach = 3;
    View view = 4;
    Watch watch = 5;
  }
}

message Hello {
  string gateway_id = 1;
}

message Attach {
  uint64 conn_id = 1;
  string session_token = 2;
}

message Detach {
  uint64 conn_id = 1;
}

// View names the channel a connection shows, empty for none: typing goes
// only to the members who see it.
message View {
  uint64 conn_id = 1;
  string channel_id = 2;
}

// Watch names the people whose presence and profile a connection shows. The
// server keeps those its user shares a team with, as it answers presence,
// and sends their Presence and ProfileChanged events to it; each Watch
// replaces the last.
message Watch {
  uint64 conn_id = 1;
  repeated string user_ids = 2;
}

message ConnectResponse {
  oneof frame {
    Welcome welcome = 1;
    Attached attached = 2;
    AttachRejected attach_rejected = 3;
    Event event = 4;
    SessionsRevoked sessions_revoked = 5;
  }
}

message Welcome {}

message Attached {
  uint64 conn_id = 1;
  User user = 2;
  string session_id = 3;
  // expires_at is when the session ends, and the connection with it.
  google.protobuf.Timestamp expires_at = 4;
}

message AttachRejected {
  uint64 conn_id = 1;
  // retry is set when the session may be valid and the attach failed for
  // another reason.
  bool retry = 2;
}

message SessionsRevoked {
  repeated string session_ids = 1;
}

message Event {
  reserved 1;
  reserved "user_ids";
  // The connections on this gateway it is for; ignored when broadcast is
  // set.
  repeated uint64 conn_ids = 19;
  bool broadcast = 2;
  oneof payload {
    MessagePosted message_posted = 3;
    MessageEdited message_edited = 4;
    MessageDeleted message_deleted = 5;
    Typing typing = 6;
    ChannelJoined channel_joined = 7;
    ChannelLeft channel_left = 8;
    Presence presence = 9;
    TeamJoined team_joined = 10;
    TeamLeft team_left = 11;
    ReactionsChanged reactions_changed = 12;
    ChannelMuted channel_muted = 13;
    ChannelUpdated channel_updated = 14;
    SavedChanged saved_changed = 15;
    PinsChanged pins_changed = 16;
    ProfileChanged profile_changed = 17;
    VoiceChannelUpdate voice_channel_update = 18;
    CallbackQuery callback_query = 23;
    CallbackAnswer callback_answer = 24;
  }
  // The update's number, set on updates of a sequence: of the channel
  // pts_channel_id names, or of the recipient's account without it.
  // pts_count is how many numbers the update takes, so a client sees a
  // gap when its last number plus pts_count falls short of pts.
  int64 pts = 20;
  int32 pts_count = 21;
  string pts_channel_id = 22;
}

// CallbackQuery tells a bot someone pressed a button of its message.
message CallbackQuery {
  // AnswerCallback takes it, within a minute.
  string id = 1;
  User from = 2;
  Message message = 3;
  string data = 4;
}

// CallbackAnswer is a bot's answer to the presser of its button.
message CallbackAnswer {
  string query_id = 1;
  string text = 2;
  bool alert = 3;
  // The bot that answered.
  User bot = 4;
}

// VoiceChannelUpdate tells a team's members who talks in one of its voice
// channels now.
message VoiceChannelUpdate {
  string team_id = 1;
  VoiceChannelState channel = 2;
}

// SavedChanged tells a person's tabs they saved a message, or dropped it.
message SavedChanged {
  string channel_id = 1;
  string message_id = 2;
  string root_id = 3;
  bool saved = 4;
}

// ProfileChanged tells everyone a person changed how others see them.
message ProfileChanged {
  User user = 1;
}

// PinsChanged tells a channel's members how many messages it pins.
message PinsChanged {
  string channel_id = 1;
  int32 count = 2;
}

// ChannelUpdated tells the members of a channel it was renamed, made public
// or private, archived or restored, or took or stopped voice messages.
message ChannelUpdated {
  Channel channel = 1;
}

message ChannelMuted {
  string channel_id = 1;
  bool muted = 2;
}

message ReactionsChanged {
  string channel_id = 1;
  string message_id = 2;
  string root_id = 3;
  repeated Reaction reactions = 4;
}

message MessagePosted {
  Message message = 1;
  // For a reply: the people taking part in its thread.
  repeated string participant_ids = 2;
  // The team of the message's channel.
  string team_id = 3;
  // Set for a direct or group conversation.
  bool conversation = 4;
}

message MessageEdited {
  Message message = 1;
}

message MessageDeleted {
  string channel_id = 1;
  string message_id = 2;
  string root_id = 3;
}

message Typing {
  string channel_id = 1;
  User user = 2;
}

message ChannelJoined {
  Channel channel = 1;
}

message ChannelLeft {
  string channel_id = 1;
  string team_id = 2;
  // Set when the person left, rather than being removed.
  bool own = 3;
  // Set when the conversation was deleted.
  bool deleted = 4;
}

message Presence {
  string user_id = 1;
  bool online = 2;
  Status status = 3;
}

message TeamJoined {
  Team team = 1;
}

message TeamLeft {
  string team_id = 1;
}
