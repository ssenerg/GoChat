syntax = "proto3";

package gochat.v1;

import "gochat/v1/types.proto";

// AuthService authenticates people. Every RPC but Me, Logout and the TOTP
// management ones runs without a session.
service AuthService {
  rpc GetSignupInfo(GetSignupInfoRequest) returns (GetSignupInfoResponse);
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc VerifyMFA(VerifyMFARequest) returns (VerifyMFAResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc Me(MeRequest) returns (MeResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc BeginTOTPSetup(BeginTOTPSetupRequest) returns (BeginTOTPSetupResponse);
  rpc ConfirmTOTPSetup(ConfirmTOTPSetupRequest) returns (ConfirmTOTPSetupResponse);
  rpc DisableTOTP(DisableTOTPRequest) returns (DisableTOTPResponse);
  // ListSessions lists the caller's sessions, or a user's for a system admin.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // RevokeSession signs one of the caller's sessions out.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // RevokeSessions signs out the caller's other sessions, or every session
  // of a user for a system admin.
  rpc RevokeSessions(RevokeSessionsRequest) returns (RevokeSessionsResponse);
  // ListSSOProviders lists the identity providers people may sign in with.
  rpc ListSSOProviders(ListSSOProvidersRequest) returns (ListSSOProvidersResponse);
  // BeginSSO starts a sign-in at a provider for a gateway, which sends the
  // browser to the URL it answers. With a session, it links the account
  // the provider signs in to the caller's instead.
  rpc BeginSSO(BeginSSORequest) returns (BeginSSOResponse);
  // FinishSSO finishes it, for the gateway the provider sent the browser
  // back to.
  rpc FinishSSO(FinishSSORequest) returns (FinishSSOResponse);
  // RedeemSSO hands an app the sign-in that finished in a browser.
  rpc RedeemSSO(RedeemSSORequest) returns (RedeemSSOResponse);
  // GetSSOLink tells what a link token links.
  rpc GetSSOLink(GetSSOLinkRequest) returns (GetSSOLinkResponse);
  // LinkSSO links the account at a provider a link token holds to the
  // caller's.
  rpc LinkSSO(LinkSSORequest) returns (LinkSSOResponse);
  // ListSSOIdentities lists the accounts at providers linked to the
  // caller's, or to a user's for a system admin.
  rpc ListSSOIdentities(ListSSOIdentitiesRequest) returns (ListSSOIdentitiesResponse);
  // UnlinkSSO unlinks one of them. An account without a password keeps its
  // last one, unless a system admin unlinks it.
  rpc UnlinkSSO(UnlinkSSORequest) returns (UnlinkSSOResponse);
}

message GetSignupInfoRequest {
  string invite_token = 1;
}

message GetSignupInfoResponse {
  // No account exists yet: the first one becomes the system admin.
  bool bootstrap = 1;
  bool open = 2;
  bool invite_valid = 3;
  string team_display_name = 4;
  // The first account needs the setup token from the server's configuration.
  bool setup_token_required = 5;
  // No account exists and the server has no setup token, so none can be
  // created until it gets one.
  bool setup_closed = 6;
}

message SignUpRequest {
  string username = 1;
  string email = 2;
  string display_name = 3;
  string password = 4;
  string invite_token = 5;
  string setup_token = 6;
}

message SignUpResponse {
  Session session = 1;
  // The team the invite joined, if any.
  Team team = 2;
}

message LoginRequest {
  // Username or email.
  string login = 1;
  string password = 2;
}

message LoginResponse {
  oneof result {
    Session session = 1;
    // A short-lived challenge to answer with VerifyMFA.
    string mfa_token = 2;
  }
}

message VerifyMFARequest {
  string mfa_token = 1;
  // A TOTP code or a recovery code.
  string code = 2;
}

message VerifyMFAResponse {
  Session session = 1;
}

message LogoutRequest {}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  User user = 1;
  string email = 2;
  string session_id = 3;
  // False for an account that signs in only with single sign-on.
  bool has_password = 4;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message BeginTOTPSetupRequest {
  string password = 1;
}

message BeginTOTPSetupResponse {
  string secret = 1;
  string url = 2;
}

message ConfirmTOTPSetupRequest {
  string code = 1;
}

message ConfirmTOTPSetupResponse {
  repeated string recovery_codes = 1;
}

message DisableTOTPRequest {
  string password = 1;
  string code = 2;
}

message DisableTOTPResponse {}

message ListSessionsRequest {
  // Empty for the caller.
  string user_id = 1;
}

message ListSessionsResponse {
  // The most recently seen first.
  repeated SessionInfo sessions = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
}

message RevokeSessionResponse {}

message RevokeSessionsRequest {
  // Empty for the caller, whose current session stays signed in.
  string user_id = 1;
}

message RevokeSessionsResponse {
  int32 revoked = 1;
}

message ListSSOProvidersRequest {}

message ListSSOProvidersResponse {
  repeated SSOProvider providers = 1;
}

message BeginSSORequest {
  string provider_id = 1;
  // Where the provider sends the browser back: the gateway's
  // /login/sso/callback.
  string redirect_uri = 2;
  // For an app: the S256 PKCE challenge of a verifier it keeps, which
  // RedeemSSO takes.
  string app_challenge = 3;
}

message BeginSSOResponse {
  // Where to send the browser.
  string url = 1;
  // What the provider sends back, which the browser must hold too.
  string state = 2;
}

message FinishSSORequest {
  string state = 1;
  string code = 2;
  // The invite the person came with, for a new account.
  string invite_token = 3;
}

message FinishSSOResponse {
  oneof result {
    Session session = 1;
    // A short-lived challenge to answer with VerifyMFA.
    string mfa_token = 2;
    // For an app's sign-in: what it redeems with RedeemSSO.
    string app_code = 3;
    // The account at the provider is new and its email has a GoChat
    // account, which links it with LinkSSO once its owner signs in.
    string link_token = 4;
    // The account at the provider is now linked to the caller's.
    bool linked = 5;
  }
  string provider_name = 6;
  // The team an invite joined, for a new account.
  Team team = 7;
}

message RedeemSSORequest {
  string code = 1;
  // The PKCE verifier of the app_challenge the sign-in began with.
  string verifier = 2;
}

message RedeemSSOResponse {
  oneof result {
    Session session = 1;
    // A short-lived challenge to answer with VerifyMFA.
    string mfa_token = 2;
  }
}

message GetSSOLinkRequest {
  string link_token = 1;
}

message GetSSOLinkResponse {
  string provider_name = 1;
  // The account's email at the provider.
  string email = 2;
}

message LinkSSORequest {
  string link_token = 1;
}

message LinkSSOResponse {
  string provider_name = 1;
  string email = 2;
}

message ListSSOIdentitiesRequest {
  // Empty for the caller.
  string user_id = 1;
}

message ListSSOIdentitiesResponse {
  // The first linked first.
  repeated SSOIdentity identities = 1;
}

message UnlinkSSORequest {
  // Empty for the caller.
  string user_id = 1;
  string issuer = 2;
  string subject = 3;
}

message UnlinkSSOResponse {}
