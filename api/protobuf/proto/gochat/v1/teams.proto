syntax = "proto3";

package gochat.v1;

import "gochat/v1/types.proto";
import "google/protobuf/timestamp.proto";

service TeamService {
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse);
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse);
  rpc ListTeamMembers(ListTeamMembersRequest) returns (ListTeamMembersResponse);
  rpc RemoveTeamMember(RemoveTeamMemberRequest) returns (RemoveTeamMemberResponse);
  // LeaveTeam takes the caller out of a team, its channels and its
  // conversations. The last admin leaves only a team no one else is in.
  rpc LeaveTeam(LeaveTeamRequest) returns (LeaveTeamResponse);
  rpc UpdateTeamMemberRole(UpdateTeamMemberRoleRequest) returns (UpdateTeamMemberRoleResponse);
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc GetInvite(GetInviteRequest) returns (GetInviteResponse);
  rpc AcceptInvite(AcceptInviteRequest) returns (AcceptInviteResponse);
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  // SetTeamPhoto takes a processed photo: see the photo package.
  rpc SetTeamPhoto(SetTeamPhotoRequest) returns (SetTeamPhotoResponse);
  rpc RemoveTeamPhoto(RemoveTeamPhotoRequest) returns (RemoveTeamPhotoResponse);
}

message CreateTeamRequest {
  string name = 1;
  string display_name = 2;
  string description = 3;
}

message CreateTeamResponse {
  Team team = 1;
}

message ListTeamsRequest {}

message ListTeamsResponse {
  repeated Team teams = 1;
}

message GetTeamRequest {
  oneof key {
    string id = 1;
    string name = 2;
  }
}

message GetTeamResponse {
  Team team = 1;
}

message ListTeamMembersRequest {
  string team_id = 1;
  // Case-insensitive prefix of the username or display name; empty lists all.
  string query = 2;
  uint32 limit = 3;
  // after continues a listing from a response's next.
  string after = 4;
}

message ListTeamMembersResponse {
  repeated TeamMember members = 1;
  // next continues the listing; empty at its end.
  string next = 2;
}

message RemoveTeamMemberRequest {
  string team_id = 1;
  string user_id = 2;
}

message RemoveTeamMemberResponse {}

message LeaveTeamRequest {
  string team_id = 1;
}

message LeaveTeamResponse {}

message UpdateTeamMemberRoleRequest {
  string team_id = 1;
  string user_id = 2;
  TeamRole role = 3;
}

message UpdateTeamMemberRoleResponse {}

message CreateInviteRequest {
  string team_id = 1;
}

message CreateInviteResponse {
  // Shown once: only its hash is stored.
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message GetInviteRequest {
  string token = 1;
}

message GetInviteResponse {
  bool valid = 1;
  string team_display_name = 2;
}

message AcceptInviteRequest {
  string token = 1;
}

message AcceptInviteResponse {
  Team team = 1;
}

message ListInvitesRequest {
  string team_id = 1;
  // after continues a listing from a response's next.
  string after = 2;
}

// InviteSummary describes an open invite without its token.
message InviteSummary {
  // id names the invite for revoking it; the link cannot be derived from it.
  string id = 1;
  User created_by = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  // active is false while the creator may not invite, which suspends it.
  bool active = 5;
}

message ListInvitesResponse {
  repeated InviteSummary invites = 1;
  // next continues the listing; empty at its end.
  string next = 2;
}

message RevokeInviteRequest {
  string team_id = 1;
  string invite_id = 2;
}

message RevokeInviteResponse {}

message SetTeamPhotoRequest {
  string team_id = 1;
  bytes image = 2;
}

message SetTeamPhotoResponse {
  Team team = 1;
}

message RemoveTeamPhotoRequest {
  string team_id = 1;
}

message RemoveTeamPhotoResponse {
  Team team = 1;
}
