syntax = "proto3";

package gochat.v1;

import "gochat/v1/types.proto";

service FileService {
  // The first message is the header, every other one a chunk.
  rpc Upload(stream UploadRequest) returns (UploadResponse);
  // The first message is the header, every other one a chunk.
  rpc Download(DownloadRequest) returns (stream DownloadResponse);
  rpc GetPhoto(GetPhotoRequest) returns (GetPhotoResponse);
  // GetStorageUsage tells how much the caller's attachments take, or a
  // user's for a system admin.
  rpc GetStorageUsage(GetStorageUsageRequest) returns (GetStorageUsageResponse);
  // DiscardUploads deletes uploads of the caller's that are not posted, such
  // as those an upload sent before one of its files failed.
  rpc DiscardUploads(DiscardUploadsRequest) returns (DiscardUploadsResponse);
  // GetLinkImage returns the picture of a link preview, which the server
  // fetched and made safe to show.
  rpc GetLinkImage(GetLinkImageRequest) returns (GetLinkImageResponse);
}

message GetLinkImageRequest {
  // A LinkPreview's image_id.
  string id = 1;
}

message GetLinkImageResponse {
  bytes image = 1;
  string content_type = 2;
}

message UploadHeader {
  string channel_id = 1;
  string name = 2;
  // Set for a voice message, which only channels that allow voice take and
  // which must be audio.
  bool voice = 3;
  uint32 duration_ms = 4;
}

message UploadRequest {
  oneof part {
    UploadHeader header = 1;
    bytes chunk = 2;
  }
}

message UploadResponse {
  Attachment attachment = 1;
}

message DownloadRequest {
  string attachment_id = 1;
  // Only these bytes, as an HTTP Range asks; the whole file when unset.
  ByteRange range = 2;
}

// ByteRange is one range of bytes as in an HTTP Range header: first to last
// inclusive, last below zero for the end; or with suffix above zero, the
// last suffix bytes.
message ByteRange {
  int64 first = 1;
  int64 last = 2;
  int64 suffix = 3;
}

message DownloadResponse {
  oneof part {
    Attachment header = 1;
    bytes chunk = 2;
  }
  // With the header of a ranged download: the bytes that follow, or
  // unsatisfiable when the range starts past the end and none follow.
  ByteRange served = 3;
  bool unsatisfiable = 4;
}

message DiscardUploadsRequest {
  repeated string attachment_ids = 1;
}

message DiscardUploadsResponse {}

message GetPhotoRequest {
  oneof owner {
    string user_id = 1;
    string team_id = 2;
  }
  string version = 3;
}

message GetPhotoResponse {
  bytes image = 1;
  string content_type = 2;
  // The current version, which differs from the one asked for once the photo
  // changed.
  string version = 3;
}

message GetStorageUsageRequest {
  // Empty for the caller.
  string user_id = 1;
}

message GetStorageUsageResponse {
  int64 used = 1;
  // Zero when there is no limit.
  int64 quota = 2;
  // The user has a quota of their own rather than the server's default.
  bool custom = 3;
}
