syntax = "proto3";

package gochat.v1;

import "gochat/v1/types.proto";

service FileService {
  // The first message is the header, every other one a chunk.
  rpc Upload(stream UploadRequest) returns (UploadResponse);
  // The first message is the header, every other one a chunk.
  rpc Download(DownloadRequest) returns (stream DownloadResponse);
  rpc GetPhoto(GetPhotoRequest) returns (GetPhotoResponse);
  // GetStorageUsage tells how much the caller's attachments take, or a
  // user's for a system admin.
  rpc GetStorageUsage(GetStorageUsageRequest) returns (GetStorageUsageResponse);
  // DiscardUploads deletes uploads of the caller's that no message carries,
  // giving their space back.
  rpc DiscardUploads(DiscardUploadsRequest) returns (DiscardUploadsResponse);
}

message DiscardUploadsRequest {
  repeated string attachment_ids = 1;
}

message DiscardUploadsResponse {}

message UploadHeader {
  string channel_id = 1;
  string name = 2;
  // Set for a voice message, which only channels that allow voice take and
  // which must be audio.
  bool voice = 3;
  uint32 duration_ms = 4;
}

message UploadRequest {
  oneof part {
    UploadHeader header = 1;
    bytes chunk = 2;
  }
}

message UploadResponse {
  Attachment attachment = 1;
}

message DownloadRequest {
  string attachment_id = 1;
  // The bytes to send from offset on, length of them or with 0 the rest.
  // The header still gives the whole file's size; an offset past it sends
  // no chunks.
  int64 offset = 2;
  int64 length = 3;
}

message DownloadResponse {
  oneof part {
    Attachment header = 1;
    bytes chunk = 2;
  }
}

message GetPhotoRequest {
  oneof owner {
    string user_id = 1;
    string team_id = 2;
  }
  string version = 3;
}

message GetPhotoResponse {
  bytes image = 1;
  string content_type = 2;
  // The current version, which differs from the one asked for once the photo
  // changed.
  string version = 3;
}

message GetStorageUsageRequest {
  // Empty for the caller.
  string user_id = 1;
}

message GetStorageUsageResponse {
  int64 used = 1;
  // Zero when there is no limit.
  int64 quota = 2;
  // The user has a quota of their own rather than the server's default.
  bool custom = 3;
}
