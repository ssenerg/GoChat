syntax = "proto3";

package gochat.v1;

import "google/protobuf/timestamp.proto";

enum SystemRole {
  SYSTEM_ROLE_UNSPECIFIED = 0;
  SYSTEM_ROLE_USER = 1;
  SYSTEM_ROLE_ADMIN = 2;
}

enum TeamRole {
  TEAM_ROLE_UNSPECIFIED = 0;
  TEAM_ROLE_MEMBER = 1;
  TEAM_ROLE_ADMIN = 2;
}

enum ChannelRole {
  CHANNEL_ROLE_UNSPECIFIED = 0;
  CHANNEL_ROLE_MEMBER = 1;
  CHANNEL_ROLE_ADMIN = 2;
}

// Status is how available a person is. Chosen, ONLINE means online while
// connected.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ONLINE = 1;
  STATUS_AWAY = 2;
  STATUS_DND = 3;
  STATUS_OFFLINE = 4;
}

// CustomStatus is what a person says they are up to.
message CustomStatus {
  // An emoji name.
  string emoji = 1;
  string text = 2;
  // Unset when it stays until cleared.
  google.protobuf.Timestamp expires_at = 3;
}

enum ChannelType {
  CHANNEL_TYPE_UNSPECIFIED = 0;
  CHANNEL_TYPE_PUBLIC = 1;
  CHANNEL_TYPE_PRIVATE = 2;
  CHANNEL_TYPE_DIRECT = 3;
  CHANNEL_TYPE_GROUP = 4;
  // A voice channel carries no messages: its members talk live.
  CHANNEL_TYPE_VOICE = 5;
}

message User {
  string id = 1;
  string username = 2;
  string display_name = 3;
  SystemRole role = 4;
  bool totp_enabled = 5;
  google.protobuf.Timestamp created_at = 6;
  bool deactivated = 7;
  // photo is the version of the profile photo, empty when there is none.
  string photo = 8;
  // The status the user chose and until when do-not-disturb lasts, for the
  // user only.
  Status status = 9;
  google.protobuf.Timestamp dnd_until = 10;
  CustomStatus custom_status = 11;
  // A bot, and the person who owns it.
  bool bot = 12;
  string bot_owner_id = 13;
}

message Session {
  string token = 1;
  string id = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// SessionInfo describes a signed-in browser or device, never its token.
message SessionInfo {
  string id = 1;
  string user_agent = 2;
  // The address it signed in from, and the one it was last seen at.
  string ip = 3;
  string last_ip = 4;
  google.protobuf.Timestamp created_at = 5;
  // Unset until it is first seen after signing in.
  google.protobuf.Timestamp last_seen_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  // The session of the request.
  bool current = 8;
}

message Team {
  string id = 1;
  string name = 2;
  string display_name = 3;
  string description = 4;
  // The caller's role in the team.
  TeamRole role = 5;
  google.protobuf.Timestamp created_at = 6;
  // photo is the version of the team photo, empty when there is none.
  string photo = 7;
  // The team's creator, its owner: only they or a system admin demote or
  // remove its admins.
  string owner_id = 8;
}

message TeamMember {
  User user = 1;
  TeamRole role = 2;
  google.protobuf.Timestamp joined_at = 3;
}

message Channel {
  string id = 1;
  string team_id = 2;
  string name = 3;
  string display_name = 4;
  string purpose = 5;
  ChannelType type = 6;
  // The caller's role in the channel, unspecified when not a member.
  ChannelRole role = 7;
  string last_message_id = 8;
  string last_read_id = 9;
  // The other side of a direct channel.
  User peer = 10;
  google.protobuf.Timestamp created_at = 11;
  // Unread messages that call out the caller, or every unread one in a
  // direct conversation.
  int32 mention_count = 12;
  bool muted = 13;
  // The others of a group conversation.
  repeated User peers = 14;
  // Set while the channel is archived: read only.
  google.protobuf.Timestamp archived_at = 15;
  int32 pinned_count = 16;
  // Whether members may post voice messages. Direct and group
  // conversations always allow them.
  bool voice_enabled = 17;
  // The number of the channel's latest update: a client replays what
  // follows it with UpdatesService.GetChannelDifference.
  int64 pts = 18;
}

message ChannelMember {
  User user = 1;
  ChannelRole role = 2;
  google.protobuf.Timestamp joined_at = 3;
}

message Attachment {
  string id = 1;
  string name = 2;
  string content_type = 3;
  int64 size = 4;
  // A voice message recorded in the browser, played in place.
  bool voice = 5;
  // The length of a voice message, as its recorder measured it.
  uint32 duration_ms = 6;
}

message Message {
  string id = 1;
  string channel_id = 2;
  User author = 3;
  string content = 4;
  repeated Attachment attachments = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp edited_at = 7;
  // A reply names its thread's root; a root counts its replies.
  string root_id = 8;
  int32 reply_count = 9;
  google.protobuf.Timestamp last_reply_at = 10;
  repeated Reaction reactions = 11;
  bool pinned = 12;
  // Whether the caller saved the message.
  bool saved = 13;
  // The buttons a bot put under the message.
  Markup markup = 14;
}

// Markup is rows of buttons under a bot's message.
message Markup {
  repeated ButtonRow rows = 1;
}

message ButtonRow {
  repeated Button buttons = 1;
}

// Button is a button under a bot's message: pressing one with
// callback_data tells the bot, one with url opens it.
message Button {
  string text = 1;
  oneof action {
    // Up to 64 bytes, handed back to the bot in a CallbackQuery.
    string callback_data = 2;
    // An http or https URL.
    string url = 3;
  }
}

// VoiceState is one person talking in a voice channel.
message VoiceState {
  User user = 1;
  string channel_id = 2;
  bool self_mute = 3;
  bool self_deaf = 4;
  // Whether the others get their camera, and their screen, as the voice
  // server reports it.
  bool self_video = 5;
  bool self_stream = 6;
}

// VoiceChannelState is everyone talking in a voice channel. Version grows
// with each change, so an older state never replaces a newer one.
message VoiceChannelState {
  string channel_id = 1;
  repeated VoiceState states = 2;
  uint64 version = 3;
}

// Reaction is one emoji on a message and who reacted with it.
message Reaction {
  string emoji = 1;
  repeated string user_ids = 2;
}
