logging:
  console:
    enabled: true
    level: info
    format: json
  file:
    enabled: false
    name: server
    level: debug
    format: json
    folder: .logs
    max_size: 10
    max_age: 7
    max_backups: 10
    compress: false
  version: false

server:
  drpc:
    address: "0.0.0.0:7070"
    # Shared with every web gateway; at least 32 characters.
    gateway_key: ""
    # Voice servers' own key; empty refuses them.
    voice_server_key: ""
    tls:
      enabled: false
      cert_file: ""
      key_file: ""
      client_ca_file: ""
    max_message_size: 4194304
    max_connections: 4096
    inactivity_timeout: 5m
    write_timeout: 30s
    request_timeout: 15s
    shutdown_timeout: 15s
  admin:
    enabled: true
    address: "0.0.0.0:9100"
    shutdown_timeout: 5s

database:
  scylla:
    hosts:
      - localhost:9042
    keyspace: gochat
    username: ""
    password: ""
    local_dc: ""
    consistency: local_quorum
    serial_consistency: local_serial
    timeout: 5s
    connect_timeout: 10s
    num_conns: 2
    disable_host_lookup: false
    replication: "{'class': 'NetworkTopologyStrategy', 'replication_factor': 3}"
    tls:
      enabled: false
      ca_file: ""
      cert_file: ""
      key_file: ""

storage:
  minio:
    endpoint: localhost:9000
    access_key: ""
    secret_key: ""
    bucket: gochat-attachments
    region: us-east-1
    use_ssl: false
    part_size: 8388608

services:
  accounts:
    workers: 8
    op_timeout: 10s
    # Above OWASP's minimum; stored hashes take these on the next sign-in.
    password:
      time: 2
      memory_kib: 47104
      threads: 1
    min_password_length: 10
    session_ttl: 720h
    session_cache_ttl: 1m
    session_cache_size: 100000
    # How often a session in use records when and where it was last seen.
    last_seen_interval: 5m
    # A session unused this long ends, as if signed out.
    session_idle_timeout: 168h
    mfa_ttl: 5m
    mfa_max_attempts: 5
    totp_issuer: GoChat
    # Seals TOTP secrets at rest: 32 random bytes, base64.
    secret_key: ""
    open_signup: false
    # Creating the first (admin) account requires this token. Without one,
    # no account can be created at all, unless allow_open_bootstrap lets
    # whoever signs up first become the admin.
    setup_token: ""
    allow_open_bootstrap: false
    login_failures: 10
    login_window: 15m
  directory:
    workers: 16
    op_timeout: 10s
    invite_ttl: 168h
    max_invites: 100
    max_teams_per_day: 5
  channels:
    idle_timeout: 10m
    op_timeout: 10s
    max_message_length: 16000
    max_attachments: 10
    history_limit: 100
    typing_interval: 3s
    post_rate: 5
    post_burst: 20
  files:
    workers: 8
    op_timeout: 30s
    max_size: 52428800
    # Bytes of attachments each person may keep, 0 for no limit. A system
    # admin can give someone another quota.
    quota: 1073741824
    max_voice_duration: 10m
    max_voice_size: 16777216
    max_uploads: 64
    max_user_uploads: 4
    orphan_after: 24h
    janitor_interval: 1h
  search:
    workers: 8
    writers: 4
    op_timeout: 15s
    # Searches per second one person may run, and in a burst.
    rate: 1
    burst: 5
    backfill: true
  voice:
    token_ttl: 30s
    max_per_channel: 25
    max_pending_per_user: 5
    server_queue_limit: 4096
    members_ttl: 15s
    op_timeout: 10s
  updates:
    # How long updates are kept for apps and bots to catch up on.
    retention: 168h
    idle_timeout: 10m
    op_timeout: 10s
    difference_limit: 100
  bots:
    workers: 4
    op_timeout: 10s
    max_per_owner: 20
    webhook_timeout: 10s
    webhook_retry_max: 5m
    # Lets webhooks reach loopback and private addresses, and plain http:
    # for development only.
    allow_private_webhooks: false
  hub:
    gateway_queue_limit: 65536
    presence_grace: 10s
  users:
    cache_size: 100000
    cache_ttl: 1m
